<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeamRudys</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <!-- LEFT -->
  <aside class="card">
    <div class="avatar">
      <img src="./image/pro.jpeg">
    </div>

    <div class="name">
      <h1>TEAMRUDYS</h1>
    </div>

    <div class="copy-box">
      CURRENT WORLD
      <span id="copyText">RUDLO91</span>
      <button onclick="copyText(this)">Copy</button>
    </div>

    <div class="tags">
      <span class="tag">OUR TEAM PROVIDES SEVERAL GAMES</span>
    </div>
  </aside>

  <!-- RIGHT -->
  <main class="right">
    <!-- 🔥 HARGA PENJUALAN (REPLACE SKILLS) -->
    <section class="card">
      <center><h3>JOIN OUR TEAM</h3></center>

      <div class="price-card">
        <h2>REME/LEME RIGHT</h2>
        <div class="price">200<img src="./image/bgl.png" class="ukuran"></div>
        <p class="muted">No ID Required</p>
        <button class="buy-btn">JOIN NOW</button>
      </div>

      <div class="price-card">
        <h2>REME/LEME LEFT</h2>
      <div class="price">150<img src="./image/bgl.png" class="ukuran"></div>
        <p class="muted">No ID Required</p>
        <button class="buy-btn">JOIN NOW</button>
      </div>
      
      <div class="price-card">
        <h2>CASINO RIGHT</h2>
      <div class="price">150<img src="./image/bgl.png" class="ukuran"></div>
        <p class="muted">No ID Required</p>
        <button class="buy-btn">JOIN NOW</button>
      </div>
      
      <div class="price-card">
        <h2>CASINO LEFT</h2>
      <div class="price">100<img src="./image/bgl.png" class="ukuran"></div>
        <p class="muted">No ID Required</p>
        <button class="buy-btn">JOIN NOW</button>
      </div>
    </section>
    
  </main>
</div>
<script src="script.js"></script>

</body>
</html>
